<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DirectorDesk | Independent Director Governance & Compliance Platform</title>
<style>
:root{
  --bg:#0A1120;
  --bg-2:#0D1526;
  --panel:#121D33;
  --panel-2:#0F1828;
  --border:#22314C;
  --border-soft:#1A2740;
  --blue:#2F7DFF;
  --blue-dim:#1E5AC7;
  --blue-soft:rgba(47,125,255,0.14);
  --text:#EAF0FB;
  --text-dim:#8FA0BE;
  --text-faint:#5D6E8C;
  --green:#2FCB7E;
  --green-soft:rgba(47,203,126,0.14);
  --amber:#F0A93C;
  --amber-soft:rgba(240,169,60,0.14);
  --red:#EF5A6F;
  --red-soft:rgba(239,90,111,0.14);
  --radius:10px;
  --radius-sm:6px;
  --sidebar-w:252px;
  --topbar-h:60px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13.5px;}
::selection{background:var(--blue-soft);}

/* focus visibility for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:2px;
}

/* ===== Layout shell ===== */
#app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
#sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  background:var(--bg-2);
  border-right:1px solid var(--border-soft);
  height:100vh;
  position:sticky;
  top:0;
  overflow-y:auto;
  padding:16px 10px 24px;
  transition:transform .2s ease;
  z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

.brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 10px 18px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:14px;
}
.brand-mark{
  width:34px; height:34px; border-radius:8px;
  background:linear-gradient(135deg, var(--blue), #1B4FB8);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px; color:#fff; letter-spacing:-0.5px;
  flex-shrink:0;
}
.brand-text .t1{font-weight:700; font-size:14.5px; letter-spacing:-0.2px;}
.brand-text .t2{font-size:11px; color:var(--text-dim); margin-top:1px;}

.sidebar-footer{
  margin-top:18px; padding:14px 12px 6px;
  border-top:1px solid var(--border-soft);
}
.sf-line{font-size:10.5px; color:var(--text-faint); line-height:1.5;}
.sf-line strong{color:var(--text-dim); font-weight:600;}

.nav-group{margin-bottom:6px;}
.nav-group-label{
  font-size:10.5px;
  color:var(--text-faint);
  padding:14px 12px 6px;
  font-weight:600;
  letter-spacing:0.3px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8.5px 12px;
  border-radius:var(--radius-sm);
  color:var(--text-dim);
  font-size:13.2px;
  cursor:pointer;
  margin:1px 0;
  border:1px solid transparent;
  position:relative;
}
.nav-item:hover{background:var(--panel); color:var(--text);}
.nav-item.active{background:var(--blue-soft); color:#fff; border-color:rgba(47,125,255,0.35);}
.nav-item.active .nav-ico{color:var(--blue);}
.nav-ico{width:16px; text-align:center; flex-shrink:0; font-size:14px; color:var(--text-faint);}
.nav-badge{
  margin-left:auto; font-size:10.5px; font-weight:700;
  background:var(--red-soft); color:var(--red);
  padding:1px 6px; border-radius:20px; min-width:16px; text-align:center;
}

/* ---- Main column ---- */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}

/* ---- Topbar ---- */
#topbar{
  height:var(--topbar-h);
  border-bottom:1px solid var(--border-soft);
  background:rgba(13,21,38,0.9);
  backdrop-filter:blur(6px);
  display:flex; align-items:center; gap:14px;
  padding:0 20px;
  position:sticky; top:0; z-index:30;
}
#menuToggle{
  display:none; background:none; border:1px solid var(--border); color:var(--text);
  width:34px; height:34px; border-radius:var(--radius-sm); font-size:15px;
}
.company-id{display:flex; flex-direction:column; line-height:1.25;}
.company-id .c-name{font-weight:700; font-size:13.5px;}
.company-id .c-meta{font-size:10.8px; color:var(--text-faint);}

.topbar-search{
  flex:1; max-width:380px;
  display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:0 10px; height:34px;
}
.topbar-search input{
  background:none; border:none; outline:none; color:var(--text); width:100%; font-size:13px;
}
.topbar-search input::placeholder{color:var(--text-faint);}
.topbar-search .k{color:var(--text-faint); font-size:12px;}

.topbar-right{margin-left:auto; display:flex; align-items:center; gap:8px;}
.tb-date{font-size:12px; color:var(--text-dim); margin-right:6px; white-space:nowrap;}
.icon-btn{
  width:34px; height:34px; border-radius:var(--radius-sm);
  background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:14px; position:relative;
}
.icon-btn:hover{color:var(--text); border-color:var(--border);}
.icon-btn .dot{
  position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%;
  background:var(--red); border:1.5px solid var(--bg-2);
}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:0 13px; height:34px; border-radius:var(--radius-sm);
  font-size:13px; font-weight:600; border:1px solid transparent; white-space:nowrap;
}
.btn-primary{background:var(--blue); color:#fff;}
.btn-primary:hover{background:var(--blue-dim);}
.btn-ghost{background:var(--panel); border-color:var(--border); color:var(--text);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-sm{height:28px; padding:0 10px; font-size:12.2px;}
.btn-danger{background:var(--red-soft); color:var(--red); border-color:rgba(239,90,111,0.3);}
.avatar{
  width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,#3B4C6E,#1E2A45);
  display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:700; color:var(--text);
  border:1px solid var(--border);
}

/* ---- Page content ---- */
#pageContent{padding:22px 26px 60px; max-width:1400px; width:100%; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h1{font-size:19px; font-weight:700; letter-spacing:-0.2px;}
.page-head .sub{font-size:12.5px; color:var(--text-dim); margin-top:3px;}
.page-head-actions{display:flex; gap:8px; align-items:center;}

/* ===== Reusable pieces ===== */
.grid{display:grid; gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.card{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:16px;
}
.card-title{font-size:13px; font-weight:700; margin-bottom:2px;}
.card-sub{font-size:11.5px; color:var(--text-faint);}
.section{margin-bottom:22px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.section-head h2{font-size:14.5px; font-weight:700;}
.section-head .link{font-size:12px; color:var(--blue); font-weight:600;}

.kpi{padding:16px;}
.kpi .label{font-size:11.5px; color:var(--text-dim); font-weight:600; margin-bottom:8px;}
.kpi .value{font-size:24px; font-weight:700; letter-spacing:-0.5px;}
.kpi .foot{font-size:11px; margin-top:6px; color:var(--text-faint);}
.kpi .foot.up{color:var(--green);}
.kpi .foot.down{color:var(--red);}

.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.8px; font-weight:700; padding:3px 8px; border-radius:20px;
  text-transform:none;
}
.pill-green{background:var(--green-soft); color:var(--green);}
.pill-amber{background:var(--amber-soft); color:var(--amber);}
.pill-red{background:var(--red-soft); color:var(--red);}
.pill-gray{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border);}
.pill-blue{background:var(--blue-soft); color:var(--blue);}
.dotstat{width:8px; height:8px; border-radius:50%; display:inline-block;}

.alert-row{
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-soft); background:var(--panel-2);
  margin-bottom:8px;
}
.alert-row .bar{width:4px; align-self:stretch; border-radius:3px; flex-shrink:0;}
.alert-row.high .bar{background:var(--red);}
.alert-row.medium .bar{background:var(--amber);}
.alert-row.low .bar{background:var(--green);}
.alert-body{flex:1; min-width:0;}
.alert-body .top{display:flex; gap:8px; align-items:center; margin-bottom:3px; flex-wrap:wrap;}
.alert-body .ttl{font-size:13px; font-weight:600;}
.alert-body .desc{font-size:12px; color:var(--text-dim); margin-bottom:8px;}
.alert-body .meta{font-size:11px; color:var(--text-faint);}
.alert-actions{display:flex; gap:6px; flex-wrap:wrap;}

.heat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
@media (max-width:1000px){.heat-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:640px){.heat-grid{grid-template-columns:repeat(2,1fr);}}
.heat-cell{
  border-radius:var(--radius-sm); padding:12px; border:1px solid var(--border-soft);
  background:var(--panel-2); cursor:pointer;
}
.heat-cell:hover{border-color:var(--text-faint);}
.heat-cell .name{font-size:12px; font-weight:600; margin-bottom:8px; min-height:30px;}
.heat-bar-track{height:5px; border-radius:4px; background:var(--border); overflow:hidden; margin-bottom:6px;}
.heat-bar-fill{height:100%; border-radius:4px;}
.heat-cell .pct{font-size:11px; color:var(--text-dim);}

.meeting-card{
  border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  background:var(--panel-2); padding:13px 14px; margin-bottom:8px;
}
.meeting-card .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px;}
.meeting-card .mtitle{font-size:13px; font-weight:700;}
.meeting-card .mmeta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.meeting-card .tags{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
.meeting-card .actions{display:flex; gap:6px; margin-top:8px;}

.quick-card{
  border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--panel-2);
  padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
}
.quick-card:hover{border-color:var(--blue); background:var(--panel);}
.quick-card .qi{font-size:18px;}
.quick-card .qt{font-size:12.5px; font-weight:700;}
.quick-card .qc{font-size:11px; color:var(--text-faint);}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius);}
table{width:100%; border-collapse:collapse; font-size:12.8px; min-width:640px;}
thead th{
  text-align:left; font-size:11px; color:var(--text-faint); font-weight:700;
  text-transform:none; padding:10px 12px; background:var(--panel-2); border-bottom:1px solid var(--border-soft);
  white-space:nowrap;
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--border-soft); vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
.td-actions{display:flex; gap:6px; white-space:nowrap;}
.icon-link{
  width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:6px; color:var(--text-dim); border:1px solid var(--border);
}
.icon-link:hover{color:var(--text); border-color:var(--text-faint);}
.empty-state{
  text-align:center; padding:44px 20px; color:var(--text-faint);
}
.empty-state .ei{font-size:26px; margin-bottom:8px;}
.empty-state .et{font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:4px;}
.empty-state .ed{font-size:12px;}

/* toolbar (filters) */
.toolbar{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
.toolbar input[type=text], .toolbar select{
  background:var(--panel); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:7px 10px; height:34px;
}
.toolbar input[type=text]{min-width:200px; flex:1; max-width:280px;}

/* forms */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.form-field{display:flex; flex-direction:column; gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:11.5px; font-weight:600; color:var(--text-dim);}
.form-field input, .form-field select, .form-field textarea{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:8px 10px; width:100%;
}
.form-field textarea{resize:vertical; min-height:64px;}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{border-color:var(--blue);}
.field-hint{font-size:10.8px; color:var(--text-faint);}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(6,10,20,0.65); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
}
.modal{
  background:var(--bg-2); border:1px solid var(--border); border-radius:12px;
  width:100%; max-width:620px; padding:20px 22px 22px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:15.5px; font-weight:700;}
.modal-close{
  width:28px; height:28px; border-radius:8px; background:var(--panel); border:1px solid var(--border);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:14px;
}
.modal-foot{display:flex; justify-content:space-between; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--border-soft);}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--green);
  padding:11px 16px; border-radius:8px; font-size:12.8px; min-width:220px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4); animation:toastIn .18s ease;
}
.toast.err{border-left-color:var(--red);}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.disclaimer-strip{
  background:var(--amber-soft); border:1px solid rgba(240,169,60,0.3); color:var(--amber);
  border-radius:var(--radius-sm); padding:10px 14px; font-size:11.8px; margin-bottom:18px;
  display:flex; gap:8px; align-items:flex-start;
}

/* AI assistant drawer */
#aiDrawer{
  position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw;
  background:var(--bg-2); border-left:1px solid var(--border); z-index:90;
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease;
}
#aiDrawer.open{transform:translateX(0);}
.ai-head{padding:16px 18px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center;}
.ai-head .ttl{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.ai-mode{font-size:10.5px; color:var(--amber); background:var(--amber-soft); padding:2px 7px; border-radius:20px; font-weight:700;}
.ai-msgs{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.ai-msg{max-width:88%; padding:9px 12px; border-radius:10px; font-size:12.8px; line-height:1.5;}
.ai-msg.user{align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:3px;}
.ai-msg.bot{align-self:flex-start; background:var(--panel); border:1px solid var(--border-soft); border-bottom-left-radius:3px; white-space:pre-line;}
.ai-suggest{display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px;}
.ai-chip{font-size:11px; background:var(--panel); border:1px solid var(--border); color:var(--text-dim); padding:5px 10px; border-radius:20px;}
.ai-input-row{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--border-soft);}
.ai-input-row input{flex:1; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; color:var(--text);}

#aiOverlay{position:fixed; inset:0; background:rgba(6,10,20,0.4); z-index:85; opacity:0; pointer-events:none; transition:opacity .2s;}
#aiOverlay.open{opacity:1; pointer-events:auto;}

/* mobile */
@media (max-width:900px){
  #sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,0.5);}
  #sidebar.open{transform:translateX(0);}
  #menuToggle{display:flex; align-items:center; justify-content:center;}
  .company-id{display:none;}
  #pageContent{padding:16px 14px 50px;}
  .topbar-search{max-width:none; min-width:0; flex:1;}
  .tb-date{display:none;}
}
@media (max-width:460px){
  #topbar{padding:0 10px; gap:8px;}
  .topbar-search{min-width:60px;}
  .btn-primary .btn-label{display:none;}
}
#sidebarScrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:39;}
#sidebarScrim.open{display:block;}

.progress-track{height:6px; background:var(--border); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; border-radius:4px;}
.small-muted{font-size:11px; color:var(--text-faint);}
.flex-between{display:flex; justify-content:space-between; align-items:center;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;}
</style>
</head>
<body>

<div id="app">
  <div id="sidebarScrim" onclick="closeSidebar()"></div>
  <aside id="sidebar"></aside>

  <div id="main">
    <header id="topbar"></header>
    <main id="pageContent"></main>
  </div>
</div>

<div id="aiOverlay" onclick="toggleAI(false)"></div>
<div id="aiDrawer"></div>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   DirectorDesk — Independent Director Governance & Compliance Platform
   Single-file prototype. Data persists to localStorage. No backend.
   ========================================================================= */

const STORAGE_KEY = 'idgos_data_v1';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function daysUntil(d){ if(!d) return null; const dt = new Date(d+'T00:00:00'); return Math.round((dt-TODAY)/86400000); }
function money(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN'); }
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Default / sample data ---------------- */
function sampleData(){
  return {
    company: {
      name: 'Meridian Industries Ltd',
      cin: 'L27100MH2005PLC152834',
      listing: 'BSE & NSE Listed',
    },
    director: {
      name: 'Anil Sharma',
      designation: 'Independent Director',
    },
    meetings: [

/* ---------------- Storage ---------------- */
let DATA = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Failed to load saved data, using sample data.', e); }
  const d = sampleData();
  persist(d);
  return d;
}
function persist(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d||DATA)); }
  catch(e){ console.error('Storage save failed', e); toast('Could not save — browser storage may be full.', true); }
}
function saveAll(){ persist(DATA); }

function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

function navBadge(id){
  if(id==='actions') return countOverdueActions() || '';
  if(id==='disclosures') return DATA.disclosures.filter(d=>d.status==='Overdue').length || '';

  return '';
}

  return DATA.actionItems.filter(a=> a.status!=='Completed' && a.dueDate && daysUntil(a.dueDate)<0).length;

function handleGlobalSearch(q){
  if(!q || q.trim().length<2) return;
  q = q.trim().toLowerCase();
  // Route to the most relevant module based on simple keyword match, then filter there.
  let target = 'dashboard';
  if(/rpt|related.party/.test(q)) target='rpt';
  else if(/agenda/.test(q)) target='agenda';
  else if(/minute|voting/.test(q)) target='minutes';
  else if(/disclos|mbp|dir-8|dir8/.test(q)) target='disclosures';
  else if(/audit/.test(q)) target='audit';
  else if(/meeting|board/.test(q)) target='boardMeetings';
  else if(/committee/.test(q)) target='committeeMeetings';
  else if(/task|action/.test(q)) target='actions';
  else if(/calendar|deadline|compliance/.test(q)) target='calendar';
  if(target!==CURRENT_PAGE){ goTo(target); }
  setTimeout(()=>{ const f = document.getElementById('moduleSearchInput'); if(f){ f.value=q; f.dispatchEvent(new Event('input')); } },30);
}

function goTo(pageId){
  CURRENT_PAGE = pageId;
  closeSidebar();
  renderSidebar();
  renderPage();
  window.scrollTo(0,0);
}

function renderPage(){
  const el = document.getElementById('pageContent');
  switch(CURRENT_PAGE){
    case 'dashboard': el.innerHTML = renderDashboard(); break;
    case 'scorecard': el.innerHTML = renderScorecard(); break;
    case 'actions': el.innerHTML = renderModulePage('actionItems'); break;
    case 'followup': el.innerHTML = renderModulePage('actionItems', {presetStatus:'Pending', title:'Follow-up Tracker', sub:'Open action items awaiting follow-up across all meetings.'}); break;
    case 'calendar': el.innerHTML = renderCalendarPage(); break;
    case 'boardMeetings': el.innerHTML = renderMeetingsPage('Board'); break;
    case 'committeeMeetings': el.innerHTML = renderMeetingsPage('Committee'); break;
    case 'agenda': el.innerHTML = renderModulePage('agendaItems'); break;
    case 'minutes': el.innerHTML = renderModulePage('minutes'); break;
    case 'disclosures': el.innerHTML = renderModulePage('disclosures'); break;
    case 'audit': el.innerHTML = renderModulePage('auditObservations'); break;
    case 'rpt': el.innerHTML = renderModulePage('rpts'); break;
    case 'erm': el.innerHTML = renderModulePage('erm'); break;
    case 'ifc': el.innerHTML = renderModulePage('ifc'); break;
    case 'reports': el.innerHTML = renderReportsPage(); break;
    case 'settings': el.innerHTML = renderSettingsPage(); break;
    default: el.innerHTML = renderDashboard();
  }
}

let MODULE_FILTER = { search:'', status:'All' };

function renderModulePage(moduleKey, opts){
  opts = opts||{};
  const mod = MODULES[moduleKey];
  const title = opts.title || mod.title;
  const sub = opts.sub || mod.sub;
  let records = DATA[mod.dataKey] || [];
  if(opts.presetStatus){ records = records.filter(r=> r[mod.statusField] !== 'Completed'); }

  const q = (MODULE_FILTER.search||'').toLowerCase();
  let filtered = records.filter(r=>{
    if(q){
      const hay = Object.values(r).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(mod.statusField && MODULE_FILTER.status!=='All' && r[mod.statusField]!==MODULE_FILTER.status) return false;
    return true;
  });

  const statusOptionsHtml = mod.statusOptions ? `
    <select onchange="MODULE_FILTER.status=this.value; renderPage();">
      <option value="All" ${MODULE_FILTER.status==='All'?'selected':''}>All Statuses</option>
      ${mod.statusOptions.map(s=>`<option value="${s}" ${MODULE_FILTER.status===s?'selected':''}>${s}</option>`).join('')}
    </select>` : '';

  return `
    <div class="page-head">
      <div><h1>${escapeHtml(title)}</h1><div class="sub">${escapeHtml(sub)}</div></div>
      <div class="page-head-actions">
        <button class="btn btn-ghost" onclick="exportCsv('${moduleKey}')">&#8681; Export CSV</button>
        <button class="btn btn-primary" onclick="openRecordForm('${moduleKey}', null)">+ New Record</button>
      </div>
    </div>
    <div class="toolbar">
      <input type="text" id="moduleSearchInput" placeholder="Search ${escapeHtml(mod.label.toLowerCase())}…" value="${escapeHtml(MODULE_FILTER.search)}" oninput="MODULE_FILTER.search=this.value; renderPage();">
      ${statusOptionsHtml}
      <span class="small-muted">${filtered.length} of ${records.length} records</span>
    </div>
    ${renderModuleTable(moduleKey, filtered)}
  `;
}

function renderModuleTable(moduleKey, records){
  const mod = MODULES[moduleKey];
  if(records.length===0){
    return `<div class="table-wrap"><div class="empty-state">
      <div class="ei">&#128194;</div>
      <div class="et">No records found</div>
      <div class="ed">Try adjusting your filters, or add a new record to get started.</div>
    </div></div>`;
  }
  let html = `<div class="table-wrap"><table><thead><tr>`;
  mod.columns.forEach(c=> html += `<th>${escapeHtml(c.label)}</th>`);
  html += `<th>Actions</th></tr></thead><tbody>`;
  records.forEach(r=>{
    html += `<tr>`;
    mod.columns.forEach(c=>{
      html += `<td>${renderCell(r, c)}</td>`;
    });
    html += `<td class="td-actions">
      <a class="icon-link" title="Edit" onclick="openRecordForm('${moduleKey}','${r.id}')">&#9998;</a>
      <a class="icon-link" title="Delete" onclick="deleteRecord('${moduleKey}','${r.id}')">&#128465;</a>
    </td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function renderCell(r, c){
  const v = r[c.key];
  if(c.type==='date') return v ? (daysUntil(v)<0 && r.status!=='Completed' && r.status!=='Closed' && r.testStatus!=='Effective' ? `<span style="color:var(--red)">${fmtDate(v)}</span>` : fmtDate(v)) : '—';
  if(c.type==='money') return money(v);
  if(c.type==='pill'){ const cls = (c.pillMap&&c.pillMap[v])||'gray'; return v? `<span class="pill pill-${cls}">${escapeHtml(v)}</span>`:'—'; }
  if(c.type==='status'){
    const mod = Object.values(MODULES).find(m=>m.statusColor && m.statusOptions && m.statusOptions.includes(v));
    const cls = (mod && mod.statusColor[v]) || 'gray';
    return v? `<span class="pill pill-${cls}">${escapeHtml(v)}</span>` : '—';
  }
  if(!v) return '—';
  const s = String(v);
  return escapeHtml(s.length>70? s.slice(0,67)+'…' : s);
}

/* ---- Record form (add/edit) ---- */
function openRecordForm(moduleKey, id){
  const mod = MODULES[moduleKey];
  const record = id ? (DATA[mod.dataKey].find(r=>r.id===id) || {}) : {};
  const isEdit = !!id;
  const fieldsHtml = mod.fields.map(f=>{
    const val = record[f.key]!==undefined ? record[f.key] : '';
    return `<div class="form-field ${f.full?'full':''}">
      <label>${escapeHtml(f.label)}${f.required?' *':''}</label>
      ${renderFieldInput(f, val)}
    </div>`;
  }).join('');

  showModal(`
    <div class="modal-head">
      <h3>${isEdit?'Edit':'New'} ${escapeHtml(mod.label.replace(/s$/,''))} Record</h3>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <form id="recordForm" onsubmit="return submitRecordForm(event,'${moduleKey}','${id||''}')">
      <div class="form-grid">${fieldsHtml}</div>
      <div class="modal-foot">
        <div>${isEdit?`<button type="button" class="btn btn-danger btn-sm" onclick="deleteRecord('${moduleKey}','${id}'); closeModal();">Delete Record</button>`:''}</div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">${isEdit?'Save Changes':'Create Record'}</button>
        </div>
      </div>
    </form>
  `);
}
function renderFieldInput(f, val){
  const name = f.key;
  if(f.type==='select'){
    return `<select name="${name}">${(f.options||[]).map(o=>`<option value="${escapeHtml(o)}" ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;
  }
  if(f.type==='textarea'){
    return `<textarea name="${name}">${escapeHtml(val)}</textarea>`;
  }
  if(f.type==='checkbox'){
    return `<input type="checkbox" name="${name}" ${val?'checked':''} style="width:18px; height:18px;">`;
  }
  return `<input type="${f.type||'text'}" name="${name}" value="${escapeHtml(val)}" ${f.required?'required':''}>`;
}
function submitRecordForm(evt, moduleKey, id){
  evt.preventDefault();
  const mod = MODULES[moduleKey];
  const form = evt.target;
  const record = id ? (DATA[mod.dataKey].find(r=>r.id===id)) : { id: uid(moduleKey.slice(0,2)) };
  mod.fields.forEach(f=>{
    const el = form.elements[f.key];
    if(!el) return;
    record[f.key] = f.type==='checkbox' ? el.checked : el.value;
  });
  if(!id){ DATA[mod.dataKey].push(record); }
  saveAll();
  closeModal();
  toast(id? 'Record updated.' : 'Record created.');
  renderTopbar(); renderSidebar(); renderPage();
  return false;
}
function deleteRecord(moduleKey, id){
  if(!confirm('Delete this record? This cannot be undone.')) return;
  const mod = MODULES[moduleKey];
  DATA[mod.dataKey] = DATA[mod.dataKey].filter(r=>r.id!==id);
  saveAll();
  toast('Record deleted.');
  renderTopbar(); renderSidebar(); renderPage();
}
function quickSetStatus(moduleKey, id, status){
  const mod = MODULES[moduleKey];
  const r = DATA[mod.dataKey].find(x=>x.id===id);
  if(!r) return;
  r[mod.statusField] = status;
  saveAll();
  toast(`Status updated to "${status}".`);
  renderTopbar(); renderSidebar(); renderPage();
}

/* ---- CSV export ---- */
function exportCsv(moduleKey){
  const mod = MODULES[moduleKey];
  const rows = DATA[mod.dataKey];
  if(!rows.length){ toast('No records to export.', true); return; }
  const headers = mod.fields.map(f=>f.key);
  const lines = [headers.join(',')];
  rows.forEach(r=>{
    lines.push(headers.map(h=>{
      let v = r[h]===undefined? '' : String(r[h]);
      v = v.replace(/"/g,'""');
      return /[,"\n]/.test(v) ? `"${v}"` : v;
    }).join(','));
  });
  downloadFile(`${moduleKey}_export_${new Date().toISOString().slice(0,10)}.csv`, lines.join('\n'), 'text/csv');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Download started: ' + filename);
}

/* =========================================================================
   Alerts engine (used by Dashboard "What Needs My Attention?")
   ========================================================================= */
function buildAlerts(){
  const alerts = [];
  // Overdue action items
  DATA.actionItems.filter(a=>a.status!=='Completed' && a.dueDate && daysUntil(a.dueDate)<0).forEach(a=>{
    alerts.push({priority:'high', title:a.title, desc:`Overdue action item — ${a.responsible||'Unassigned'}.`, meta:`Due ${fmtDate(a.dueDate)} · ${Math.abs(daysUntil(a.dueDate))} days overdue`,
      actions:[{label:'Mark In Progress', fn:()=>quickSetStatus('actionItems',a.id,'In Progress')},{label:'Complete', fn:()=>quickSetStatus('actionItems',a.id,'Completed')}], goto:'actions'});
  });
  // Upcoming statutory compliance deadlines
  DATA.complianceEvents.filter(c=>!c.completed && c.dueDate && daysUntil(c.dueDate)<=14).forEach(c=>{
    const overdue = daysUntil(c.dueDate)<0;
    alerts.push({priority: overdue?'high': (daysUntil(c.dueDate)<=5?'medium':'low'), title:c.title, desc:`${c.area} — statutory compliance deadline.`,
      meta: overdue? `Overdue by ${Math.abs(daysUntil(c.dueDate))} days` : `Due in ${daysUntil(c.dueDate)} days (${fmtDate(c.dueDate)})`,
      actions:[{label:'Mark Complete', fn:()=>{ c.completed=true; saveAll(); toast('Marked complete.'); renderTopbar();renderSidebar();renderPage(); }}], goto:'calendar'});
  });
  // Agenda review pending
  DATA.agendaItems.filter(a=>a.status==='Pending Review' || a.status==='Clarification Required').forEach(a=>{
    alerts.push({priority: a.status==='Clarification Required'?'medium':'low', title:`Review agenda: ${a.subject}`, desc:`${a.meetingRef} — ${a.status}.`,
      meta:`Agenda ${a.number}`, actions:[{label:'Review', fn:()=>openRecordForm('agendaItems', a.id)}], goto:'agenda'});
  });
  // SEBI trading window (from compliance events already covered above by keyword) — add explicit high-visibility one if present
  // Pending declarations
  DATA.disclosures.filter(d=>d.status==='Pending' || d.status==='Overdue' || d.status==='Expiring Soon').forEach(d=>{
    alerts.push({priority: d.status==='Overdue'?'high':'medium', title:`${d.type} — ${d.status}`, desc:'Statutory declaration requires attention.',
      meta: d.validity? `Valid until ${fmtDate(d.validity)}`:'', actions:[{label:'File Declaration', fn:()=>quickSetStatus('disclosures',d.id,'Filed')}], goto:'disclosures'});
  });
  // Outstanding audit observations
  DATA.auditObservations.filter(a=>a.status!=='Closed').forEach(a=>{
    alerts.push({priority: a.riskRating==='High'?'high':(a.riskRating==='Medium'?'medium':'low'), title:`Audit observation: ${a.area}`, desc:`Risk: ${a.riskRating} · Owner: ${a.responsible}`,
      meta: a.targetDate? `Target closure ${fmtDate(a.targetDate)}`:'', actions:[{label:'View Documents', fn:()=>openRecordForm('auditObservations', a.id)}], goto:'audit'});
  });
  // Pending RPT approvals
  DATA.rpts.filter(r=>r.status==='Pending Approval' || r.status==='Proposed').forEach(r=>{
    alerts.push({priority: r.status==='Pending Approval'?'medium':'low', title:`RPT: ${r.party}`, desc:`${r.nature||'Related-party transaction'} — ${money(r.value)}`,
      meta:`Approval required: ${r.approvalRequired}`, actions:[{label:'Review', fn:()=>openRecordForm('rpts', r.id)}], goto:'rpt'});
  });
  // Incomplete action items (not overdue, general)
  const priorityOrder = {high:0, medium:1, low:2};
  alerts.sort((a,b)=>priorityOrder[a.priority]-priorityOrder[b.priority]);
  return alerts;
}
function countAllAlerts(){ return buildAlerts().filter(a=>a.priority==='high').length; }
let ALERT_HANDLERS = [];

          <span class="ttl">${escapeHtml(a.title)}</span>

function governanceScore(){
  const areas = DATA.complianceAreas;
  if(!areas.length) return 0;
  return Math.round(areas.reduce((s,a)=>s+Number(a.percent||0),0)/areas.length);
}
function complianceRate(){ return governanceScore(); }

  const score = governanceScore();
  const highAlerts = buildAlerts().filter(a=>a.priority==='high').length;
  const tasksDue7 = DATA.actionItems.filter(a=>a.status!=='Completed' && a.dueDate && daysUntil(a.dueDate)>=0 && daysUntil(a.dueDate)<=7).length;

          <div class="small-muted">${escapeHtml(DATA.company.name)} · CIN ${escapeHtml(DATA.company.cin)} · ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>
        </div>
        <div style="text-align:center; min-width:140px;">

          <div class="small-muted">Governance Score</div>
        </div>
      </div>
      <div class="mt16" style="display:flex; gap:16px; flex-wrap:wrap;">
        <span class="pill ${highAlerts>0?'pill-red':'pill-green'}">${highAlerts>0? highAlerts+' High-Priority Alert'+(highAlerts>1?'s':'') : 'No High-Priority Alerts'}</span>
        <span class="pill pill-gray">${overdueActions} Overdue Task${overdueActions!==1?'s':''}</span>
        <span class="pill pill-blue">${upcomingMeetings} Upcoming Meeting${upcomingMeetings!==1?'s':''}</span>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>What Needs My Attention?</h2><span class="link" onclick="goTo('actions')">View all tasks →</span></div>

    <div class="section">

      <div class="grid g-4">
        <div class="card kpi"><div class="label">Overall Compliance Rate</div><div class="value">${complianceRate()}%</div><div class="foot ${complianceRate()>=80?'up':'down'}">${complianceRate()>=80?'On track':'Needs attention'}</div></div>
        <div class="card kpi"><div class="label">Tasks Due Within 7 Days</div><div class="value">${tasksDue7}</div><div class="foot">${overdueActions} already overdue</div></div>
        <div class="card kpi"><div class="label">Upcoming Board & Committee Meetings</div><div class="value">${upcomingMeetings}</div><div class="foot">Next: ${nextMeetingLabel()}</div></div>
        <div class="card kpi"><div class="label">Open Audit Observations</div><div class="value">${openAudit}</div><div class="foot">${DATA.auditObservations.filter(a=>a.riskRating==='High'&&a.status!=='Closed').length} high risk</div></div>
        <div class="card kpi"><div class="label">Pending Disclosures</div><div class="value">${pendingDisclosures}</div><div class="foot">${DATA.disclosures.filter(d=>d.status==='Overdue').length} overdue</div></div>

function quickCard(icon,title,sub,pageId){
  return `<div class="quick-card" onclick="goTo('${pageId}')"><div class="qi">${icon}</div><div class="qt">${title}</div><div class="qc">${sub}</div></div>`;
}
function nextMeetingLabel(){
  const upcoming = DATA.meetings.filter(m=>m.date && daysUntil(m.date)>=0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!upcoming.length) return 'None scheduled';
  return `${fmtDate(upcoming[0].date)}`;
}
function renderHeatCell(a){
  const color = a.status==='Compliant'?'var(--green)':a.status==='Overdue'?'var(--red)':'var(--amber)';
  return `<div class="heat-cell" onclick="openAreaDetail('${a.id}')">

    <div class="heat-bar-track"><div class="heat-bar-fill" style="width:${a.percent}%; background:${color};"></div></div>
    <div class="flex-between"><span class="pct">${a.percent}%</span><span class="pill pill-${a.status==='Compliant'?'green':a.status==='Overdue'?'red':'amber'}">${a.status}</span></div>

function openAreaDetail(areaId){
  const a = DATA.complianceAreas.find(x=>x.id===areaId);

function renderUpcomingMeetings(){
  const upcoming = DATA.meetings.filter(m=>m.date && daysUntil(m.date)>=-1).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,4);
  if(!upcoming.length) return `<div class="empty-state"><div class="ei">&#128197;</div><div class="et">No upcoming meetings</div></div>`;
  return upcoming.map(m=>renderMeetingCard(m)).join('');

    <div class="top">

function saveScoreArea(evt, areaId){
  evt.preventDefault();
  const f = evt.target;

  `;
}
function openMeetingForm(id, defaultType){
  const m = id ? DATA.meetings.find(x=>x.id===id) : {type:defaultType||'Board'};
  showModal(`
    <div class="modal-head"><h3>${id?'Edit':'Schedule'} Meeting</h3><button class="modal-close" onclick="closeModal()">&#10005;</button></div>
    <form onsubmit="return saveMeeting(event,'${id||''}')">

          <option value="Board" ${m.type==='Board'?'selected':''}>Board</option>
          <option value="Committee" ${m.type==='Committee'?'selected':''}>Committee</option>
        </select></div>
        <div class="form-field" id="mtCommitteeWrap" style="display:${m.type==='Committee'?'flex':'none'};"><label>Committee Name</label><input type="text" name="committeeName" value="${escapeHtml(m.committeeName||'')}" placeholder="e.g. Audit Committee"></div>
        <div class="form-field full"><label>Meeting Number / Title *</label><input type="text" name="number" required value="${escapeHtml(m.number||'')}" placeholder="e.g. Board Meeting No. 48"></div>
        <div class="form-field"><label>Date *</label><input type="date" name="date" required value="${m.date||''}"></div>
        <div class="form-field"><label>Time</label><input type="time" name="time" value="${m.time||''}"></div>
        <div class="form-field full"><label>Venue / Video-Conference Details</label><input type="text" name="venue" value="${escapeHtml(m.venue||'')}"></div>
        <div class="form-field"><label>Notice Status</label><select name="noticeStatus">${['Not Sent','Pending','Sent'].map(s=>`<option ${m.noticeStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-field"><label>Agenda Status</label><select name="agendaStatus">${['Not Started','Draft','Circulated'].map(s=>`<option ${m.agendaStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-field"><label>Attendance</label><select name="attendance">${['Confirmed','Tentative','Not Confirmed','Attended'].map(s=>`<option ${m.attendance===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-field"><label>Voting Status</label><select name="votingStatus">${['—','Pending','Completed'].map(s=>`<option ${m.votingStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-field full"><label>Pending Action Items</label><textarea name="pendingActions">${escapeHtml(m.pendingActions||'')}</textarea></div>
      </div>
      <div class="modal-foot">
        <div>${id?`<button type="button" class="btn btn-danger btn-sm" onclick="deleteMeeting('${id}'); closeModal();">Delete</button>`:''}</div>
        <div style="display:flex; gap:8px;"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">${id?'Save Changes':'Schedule Meeting'}</button></div>
      </div>
    </form>
  `);
}
function saveMeeting(evt, id){
  evt.preventDefault();
  const f = evt.target;
  const m = id ? DATA.meetings.find(x=>x.id===id) : {id: uid('mt')};
  ['type','committeeName','number','date','time','venue','noticeStatus','agendaStatus','attendance','votingStatus','pendingActions'].forEach(k=>{
    m[k] = f.elements[k].value;
  });
  if(!id) DATA.meetings.push(m);
  saveAll(); closeModal(); toast(id?'Meeting updated.':'Meeting scheduled.');
  renderTopbar(); renderSidebar(); renderPage();
  return false;
}
function deleteMeeting(id){
  if(!confirm('Delete this meeting record?')) return;
  DATA.meetings = DATA.meetings.filter(m=>m.id!==id);
  saveAll(); toast('Meeting deleted.');
  renderTopbar(); renderSidebar(); renderPage();
}
function exportMeetingsCsv(type){
  const rows = DATA.meetings.filter(m=>m.type===type);
  if(!rows.length){ toast('No records to export.', true); return; }
  const headers = ['type','committeeName','number','date','time','venue','noticeStatus','agendaStatus','attendance','votingStatus','pendingActions'];
  const lines = [headers.join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(',')));
  downloadFile(`${type.toLowerCase()}_meetings_${new Date().toISOString().slice(0,10)}.csv`, lines.join('\n'), 'text/csv');
}

function saveCalendarEvent(evt, id){
  evt.preventDefault();
  const f = evt.target;
  const e = id ? DATA.complianceEvents.find(x=>x.id===id) : {id: uid('ce')};
  e.title = f.elements.title.value;
  e.area = f.elements.area.value;
  e.dueDate = f.elements.dueDate.value;
  e.reminderDays = Number(f.elements.reminderDays.value);
  e.completed = f.elements.completed.checked;
  e.notes = f.elements.notes.value;
  if(!id) DATA.complianceEvents.push(e);
  saveAll(); closeModal(); toast(id?'Event updated.':'Event added.');
  renderTopbar(); renderSidebar(); renderPage();
  return false;
}
function toggleCalendarEvent(id){
  const e = DATA.complianceEvents.find(x=>x.id===id);
  e.completed = true; saveAll(); toast('Marked complete.');
  renderTopbar(); renderSidebar(); renderPage();
}
function deleteCalendarEvent(id){
  if(!confirm('Delete this compliance event?')) return;
  DATA.complianceEvents = DATA.complianceEvents.filter(e=>e.id!==id);
  saveAll(); toast('Event deleted.');
  renderTopbar(); renderSidebar(); renderPage();
}

      ${reports.map(r=>`
        <div class="card">
          <div class="card-title">${r.label}</div>
          <div class="card-sub mt8" style="min-height:32px;">${r.desc}</div>

        </div>`).join('')}

function exportGenericCsv(key){
  const rows = DATA[key];
  if(!rows || !rows.length){ toast('No records to export.', true); return; }
  const headers = Object.keys(rows[0]).filter(k=>k!=='id');
  const lines = [headers.join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>`"${String(r[h]===undefined?'':r[h]).replace(/"/g,'""')}"`).join(',')));
  downloadFile(`${key}_${new Date().toISOString().slice(0,10)}.csv`, lines.join('\n'), 'text/csv');
}

function saveCompanySettings(evt){
  evt.preventDefault();
  const f = evt.target;
  DATA.company.name = f.elements.name.value;
  DATA.company.cin = f.elements.cin.value;
  DATA.company.listing = f.elements.listing.value;
  DATA.director.name = f.elements.dname.value;
  DATA.director.designation = f.elements.ddesig.value;
  saveAll(); toast('Profile updated.');
  renderTopbar(); renderSidebar(); renderPage();
  return false;
}
function exportAllData(){
  downloadFile(`idgos_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(DATA,null,2), 'application/json');
}
function importDataPrompt(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed!=='object') throw new Error('Invalid file');
        DATA = Object.assign(sampleDataShape(), parsed);
        saveAll();
        toast('Data imported successfully.');
        renderTopbar(); renderSidebar(); renderPage();
      }catch(e){ toast('Import failed — invalid JSON file.', true); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function sampleDataShape(){ return {company:{},director:{},meetings:[],agendaItems:[],minutes:[],actionItems:[],complianceEvents:[],disclosures:[],auditObservations:[],rpts:[],erm:[],ifc:[],complianceAreas:[]}; }
function resetDemoData(){
  if(!confirm('This will replace ALL current records with fresh sample data. Continue?')) return;
  DATA = sampleData();
  saveAll();
  toast('Demo data reset.');
  renderTopbar(); renderSidebar(); renderPage();
}

/* =========================================================================
   Governance AI Assistant — demo mode (local, rule-based; no external API)
   ========================================================================= */
let AI_HISTORY = [
  {role:'bot', text:"Hello, I'm the Governance AI Assistant, running in demo mode. I can search your records, summarise pending items, and explain general governance requirements using the data already in this workspace.\n\nDemo-mode responses are generated locally from your records and general knowledge — they are not verified legal advice. Try one of the suggestions below, or ask a question."}
];
function toggleAI(open){
  document.getElementById('aiOverlay').classList.toggle('open', open);
  const drawer = document.getElementById('aiDrawer');
  if(open){ renderAIDrawer(); drawer.classList.add('open'); }
  else{ drawer.classList.remove('open'); }
}
function renderAIDrawer(){
  const el = document.getElementById('aiDrawer');
  el.innerHTML = `
    <div class="ai-head">
      <div class="ttl">&#129302; Governance AI Assistant <span class="ai-mode">DEMO MODE</span></div>
      <button class="modal-close" onclick="toggleAI(false)">&#10005;</button>
    </div>
    <div class="ai-msgs" id="aiMsgs">
      ${AI_HISTORY.map(m=>`<div class="ai-msg ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
    </div>
    <div class="ai-suggest">
      ${['What needs my attention today?','Summarise open audit observations','Any pending RPT approvals?','Overdue disclosures?','Next board meeting?'].map(s=>`<span class="ai-chip" style="cursor:pointer;" onclick="askAI('${s.replace(/'/g,"\\'")}')">${s}</span>`).join('')}
    </div>
    <div class="ai-input-row">
      <input type="text" id="aiInput" placeholder="Ask about your governance records…" onkeydown="if(event.key==='Enter'){ askAI(this.value); this.value=''; }">
      <button class="btn btn-primary btn-sm" onclick="const i=document.getElementById('aiInput'); askAI(i.value); i.value='';">Send</button>
    </div>
  `;
  const msgs = document.getElementById('aiMsgs');
  if(msgs) msgs.scrollTop = msgs.scrollHeight;
}
function askAI(q){
  if(!q || !q.trim()) return;
  AI_HISTORY.push({role:'user', text:q});
  const reply = generateAIReply(q.trim());
  AI_HISTORY.push({role:'bot', text:reply});
  renderAIDrawer();
}
function generateAIReply(q){
  const ql = q.toLowerCase();
  const overdueActions = DATA.actionItems.filter(a=>a.status!=='Completed' && a.dueDate && daysUntil(a.dueDate)<0);
  const openAudit = DATA.auditObservations.filter(a=>a.status!=='Closed');
  const pendingRpt = DATA.rpts.filter(r=>r.status==='Pending Approval'||r.status==='Proposed');
  const overdueDisc = DATA.disclosures.filter(d=>d.status==='Overdue'||d.status==='Expiring Soon');
  const upcoming = DATA.meetings.filter(m=>m.date && daysUntil(m.date)>=0).sort((a,b)=>new Date(a.date)-new Date(b.date));

  if(/attention|today|priorit/.test(ql)){
    const alerts = buildAlerts().slice(0,5);
    if(!alerts.length) return 'No items currently need your attention — all registers are up to date.';
    return 'Based on current records, here is what needs attention:\n' + alerts.map(a=>`• [${a.priority.toUpperCase()}] ${a.title}${a.meta? ' — '+a.meta:''}`).join('\n');
  }
  if(/audit/.test(ql)){
    if(!openAudit.length) return 'There are no open audit observations at present.';
    return `There are ${openAudit.length} open audit observation(s):\n` + openAudit.map(a=>`• ${a.area} (${a.riskRating} risk) — owner: ${a.responsible}, target: ${fmtDate(a.targetDate)}`).join('\n');
  }
  if(/rpt|related.party/.test(ql)){
    if(!pendingRpt.length) return 'No related-party transactions are currently pending approval.';
    return `${pendingRpt.length} related-party transaction(s) need approval:\n` + pendingRpt.map(r=>`• ${r.party} — ${money(r.value)}, requires ${r.approvalRequired} approval`).join('\n');
  }
  if(/disclos|mbp|dir.?8/.test(ql)){
    if(!overdueDisc.length) return 'All disclosures and declarations are currently up to date.';
    return `${overdueDisc.length} disclosure(s) need action:\n` + overdueDisc.map(d=>`• ${d.type} — ${d.status}, valid until ${fmtDate(d.validity)}`).join('\n');
  }
  if(/meeting|board/.test(ql)){
    if(!upcoming.length) return 'No upcoming meetings are currently scheduled.';
    const m = upcoming[0];
    return `The next meeting is ${m.number} on ${fmtDate(m.date)}${m.time?' at '+m.time:''}, ${m.venue||''}.\nAgenda status: ${m.agendaStatus}. Notice status: ${m.noticeStatus}.\nThere are ${upcoming.length} meeting(s) scheduled in total.`;
  }
  if(/action|task/.test(ql)){
    const open = DATA.actionItems.filter(a=>a.status!=='Completed');
    return `You have ${open.length} open action item(s), of which ${overdueActions.length} are overdue.` + (overdueActions.length? '\n' + overdueActions.map(a=>`• ${a.title} (due ${fmtDate(a.dueDate)})`).join('\n') : '');
  }
  if(/score|governance score|compliance rate/.test(ql)){
    return `The current overall governance score is ${governanceScore()}/100, based on a simple average across ${DATA.complianceAreas.length} tracked categories. The lowest-scoring category is ${[...DATA.complianceAreas].sort((a,b)=>a.percent-b.percent)[0].name}.`;
  }
  if(/trading window/.test(ql)){
    const ev = DATA.complianceEvents.find(e=>/trading window/i.test(e.title));
    if(ev) return `${ev.title} — scheduled for ${fmtDate(ev.dueDate)}. This is a configured entry; always confirm against the company's actual trading window communication under the SEBI (Prohibition of Insider Trading) Regulations.`;
    return 'No trading window event is currently configured in the compliance calendar. You can add one from the Compliance Calendar module.';
  }
  if(/hello|hi|hey/.test(ql)){
    return `Hello ${DATA.director.name.split(' ')[0]}. I can help you search records, summarise pending items, or explain general governance concepts. What would you like to know?`;
  }
  return "I can search records already in this workspace (action items, meetings, agendas, disclosures, audit observations, RPTs) and explain general governance concepts. I don't have a live connection to an external AI service in this demo, so for anything beyond your local records, please configure an AI API connection or consult your Company Secretary / legal advisor. Try asking about 'open audit observations', 'pending RPT approvals', or 'what needs my attention today'.";
}
